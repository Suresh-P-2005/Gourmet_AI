<!-- ── View: ACCOUNT PROFILE ──────────────────────────────────────── -->
<div id="accountView" style="display: none;">
    <div class="glass-card glass-content" style="max-width: 600px; margin: 0 auto; padding: 2.5rem;">
        
        <div class="profile-header">
            <div class="profile-avatar-container" onclick="document.getElementById('avatarUpload').click()">
                <img id="profileAvatarLg" src="" alt="Profile Avatar" style="display: none;">
                <div id="profileAvatarFallbackLg" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--primary);">👤</div>
                <div class="profile-avatar-overlay">📷</div>
            </div>
            <input type="file" id="avatarUpload" accept="image/*" style="display: none;" onchange="handleAvatarUpload(event)">
            
            <h2 id="profileUsernameDisplay" style="font-size: 2rem; font-family: 'Playfair Display', serif; color: var(--text-primary); margin-bottom: 0;">Username</h2>
            <p id="profileEmailDisplay" style="color: var(--text-secondary); margin-top: 0.2rem;">email@example.com</p>
            <span id="profileRoleBadge" class="badge" style="background: var(--primary-light); color: var(--primary); padding: 0.3rem 0.8rem; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 600;">Member</span>
        </div>

        <hr style="border: none; border-top: 1px solid var(--glass-border); margin: 2rem 0;">

        <h3 style="margin-bottom: 1rem; color: var(--text-primary);">Account Statistics</h3>
        <div class="profile-stats">
            <div class="glass-card stat-card">
                <h3 id="statTotalRecipes">0</h3>
                <p>Generated Recipes</p>
            </div>
            <div class="glass-card stat-card">
                <h3 id="statSavedRecipes">0</h3>
                <p>Saved to Vault</p>
            </div>
        </div>

        <div style="margin-top: 3rem; text-align: center;">
            <button class="glass-btn btn btn-secondary" onclick="handleLogout()" style="width: 100%; max-width: 200px; color: var(--toast-error); border-color: var(--toast-error);">🚪 Logout</button>
        </div>

    </div>
</div>
